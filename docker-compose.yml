services:
  # Base de Datos
  db:
    image: mariadb:10.11
    container_name: transcendence_db
    restart: always
    healthcheck:
      # Usamos mariadb-admin ping, que es más directo
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-p$${MARIADB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10      # Aumentamos a 10 para dar 50 segundos de margen
      start_period: 30s
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: root_password_42 
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - transcendence_net

  # Backend (Laravel)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transcendence_backend
    volumes:
      - ./backend:/var/www/html
    entrypoint: ["/var/www/html/docker-entrypoint.sh"]
    command: ["php-fpm"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence_net
    ports:
      - "8000:8000"

  # Frontend (Angular)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: transcendence_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    networks:
      - transcendence_net

  # Servidor Nginx (Proxy Inverso)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: transcendence_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - backend
      - frontend
    networks:
      - transcendence_net
  
  phpmyadmin:
      image: phpmyadmin:latest
      container_name: transcendence_phpmyadmin
      restart: always
      ports:
        - "8081:80"
      environment:
        # Corregido a formato de lista para evitar errores
        - PMA_HOST=db
        - PMA_PORT=3306
        - MYSQL_ROOT_PASSWORD=root_password_42
      networks:
        - transcendence_net
      depends_on:
        - db
  

networks:
  transcendence_net:
    driver: bridge

volumes:
  db_data: