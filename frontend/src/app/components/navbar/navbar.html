<nav class="flex items-center justify-between px-[8vw] py-6 border-b border-slate-800 mt-[0.5vh]">
  
  <div class="flex items-center gap-[5vw]">
    <div class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
      42 GH
    </div>

    <div class="hidden md:flex items-center space-x-[3vw] text-slate-300">
      <a href="#" (click)="$event.preventDefault(); onGames()" class="hover:text-white transition-colors text-cyan-200">Games</a>
      <a href="#" (click)="$event.preventDefault(); onLeaderboard()" class="hover:text-white transition-colors text-cyan-200">Leaderboard</a>
      <a href="#" (click)="$event.preventDefault(); onProfile()" class="hover:text-white transition-colors text-cyan-200">Profile</a>
    </div>
  </div>

  <div class="flex items-center space-x-[1vw]">
    @if (!isLoggedIn) {
      <button (click)="loginClicked.emit()" class="w-24 h-8 flex items-center justify-center rounded-[10px] border border-cyan-200 bg-transparent hover:bg-cyan-200/10 transition-all duration-300">
        <span class="text-cyan-200 text-xs font-normal font-['Inter']">Log in</span>
      </button>

      <button (click)="signUpClicked.emit()" class="w-24 h-8 flex items-center justify-center rounded-[10px] bg-gradient-to-l from-blue-900 to-sky-400 border border-blue-600 hover:brightness-125 transition-all duration-300 shadow-[0_0_10px_rgba(56,189,248,0.3)]">
        <span class="text-cyan-200 text-xs font-normal font-['Inter']">Sign up</span>
      </button>
    } @else {
      <button (click)="logout.emit()" class="text-cyan-200 text-xs mr-[3vh]">Logout</button>
      <div class="w-8 h-8 rounded-full bg-gradient-to-r from-cyan-500 to-blue-500 flex items-center justify-center text-white font-bold">
        {{ userInitial }}
      </div>
    }
  </div>
</nav>

<div class="w-full h-0.5 bg-sky-400 shadow-[0px_0px_12px_6px_rgba(121,135,253,0.40)]"></div>
