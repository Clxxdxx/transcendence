<div class="flex flex-col items-center p-16 rounded-2xl border border-blue-500/20 shadow-[0_0_50px_rgba(56,189,248,0.15)] hover:shadow-[0_0_40px_rgba(56,189,248,0.3)] hover:-translate-y-1 transition-all duration-300 w-full max-w-[280px]">
  
  <div class="w-30 h-30 mb-5 rounded-2xl border-2 border-cyan-400 flex items-center justify-center bg-cyan-400/10 shadow-[0_0_15px_rgba(34,211,238,0.4)]">
    <img [src]="svgPath" [alt]="title" class="w-20 h-20 object-contain" />
  </div>

  <h3 class="text-xl text-cyan-200 font-medium tracking-wide mb-6">
    {{ title }}
  </h3>

  <div class="w-full flex flex-col gap-3">
    
    <button (click)="playVsAi()" class="w-full py-2.5 rounded-lg bg-gradient-to-r from-blue-700 to-indigo-700 border border-blue-500 text-white text-sm font-medium hover:brightness-125 transition-all shadow-inner cursor-pointer">
      Play vs AI
    </button>
    
    <button (click)="playRanked()" class="w-full py-2.5 rounded-lg bg-gradient-to-r from-sky-400 to-indigo-400 text-white text-sm font-medium opacity-90 hover:opacity-100 hover:brightness-110 transition-all shadow-[0_0_10px_rgba(129,140,248,0.2)] cursor-pointer">
      Play Online Ranked
    </button>

  </div>
</div>
