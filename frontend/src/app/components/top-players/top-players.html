<div class="h-full bg-[#0f1333]/90 rounded-2xl border border-blue-500/30 shadow-[0_0_25px_rgba(37,99,235,0.1)] flex flex-col overflow-hidden backdrop-blur-sm">
  <div class="p-4 border-b border-blue-900/60 flex items-center gap-2 shrink-0">
    <span class="text-slate-300 text-sm">🏅</span>
    <span class="text-slate-200 text-xs font-semibold tracking-wide">Top players</span>
  </div>
  
  <div class="flex-1 overflow-y-auto p-4 space-y-2 custom-scrollbar flex flex-col">
      
      @for (player of players; track player.nick; let idx = $index) {
        <div class="flex items-center justify-between bg-[#06091f] p-2.5 rounded-xl border border-blue-900/40">
          <div class="flex items-center gap-3">
            
            @if (idx === 0) {
              <div class="w-6 h-6 rounded-full bg-gradient-to-br from-yellow-300 to-amber-500 flex items-center justify-center text-xs shadow-[0_0_8px_rgba(250,204,21,0.4)] shrink-0">
                🏆
              </div>
            } @else if (idx === 1) {
              <div class="w-6 h-6 rounded-full bg-gradient-to-br from-slate-200 to-slate-400 flex items-center justify-center text-xs shadow-[0_0_8px_rgba(226,232,240,0.4)] shrink-0">
                🥈
              </div>
            } @else if (idx === 2) {
              <div class="w-6 h-6 rounded-full bg-gradient-to-br from-orange-400 to-amber-700 flex items-center justify-center text-xs shadow-[0_0_8px_rgba(249,115,22,0.4)] shrink-0">
                🥉
              </div>
            } @else {
              <div class="w-6 h-6 rounded-full bg-cyan-500 flex items-center justify-center text-[#06091f] text-[10px] font-black shrink-0">
                {{ idx + 1 }}
              </div>
            }

            <div class="leading-tight">
              <div class="text-white text-[11px] font-bold tracking-wide line-clamp-1">
                {{ player.nick }}
              </div>
              <div class="text-slate-500 text-[9px]">Rank #{{ idx + 1 }}</div>
            </div>
          </div>

          <div class="text-right leading-tight shrink-0">
            <div class="text-cyan-400 text-[11px] font-bold">
              {{ (player.points ?? 0) | number }}
            </div>
            <div class="text-slate-500 text-[9px]">points</div>
          </div>
        </div>
      } @empty {
        <div class="text-slate-500 text-[11px] text-center py-8 flex-1 flex items-center justify-center">
          No players found
        </div>
      }
    
    <button (click)="onViewLeaderboard()" class="w-full mt-auto pt-2 pb-2 rounded-lg border border-indigo-500/30 text-indigo-400 text-[10px] font-bold uppercase tracking-widest hover:bg-indigo-500/10 transition-colors shrink-0">
      View Full Leaderboard
    </button>
  </div>
</div>
