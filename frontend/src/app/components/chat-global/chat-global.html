<div class="h-full bg-[#0f1333]/90 rounded-2xl border border-blue-500/30 shadow-[0_0_25px_rgba(37,99,235,0.1)] flex flex-col overflow-hidden backdrop-blur-sm">
  
  <div class="p-4 border-b border-blue-900/60 flex items-center gap-2.5 shrink-0">
    <div class="w-2 h-2 rounded-full bg-green-400 shadow-[0_0_8px_rgba(74,222,128,0.8)]"></div>
    <span class="text-slate-200 text-xs font-semibold tracking-wide">Live chat</span>
  </div>
  
  <div #scrollContainer class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
    @for (message of messages; track $index) {
      <div class="leading-tight animate-fade-in transition-all"
           [class.border-l-2]="message.nick === currentUserNick"
           [class.border-cyan-400]="message.nick === currentUserNick"
           [class.pl-2]="message.nick === currentUserNick"
           [class.bg-cyan-500/5]="message.nick === currentUserNick"
           [class.py-1]="message.nick === currentUserNick"
           [class.rounded-r-md]="message.nick === currentUserNick">
        
        <span [class]="message.nick === currentUserNick ? 'text-cyan-400 text-[11px] font-bold tracking-wide' : 'text-indigo-400 text-[11px] font-bold tracking-wide'">
          {{ message.nick === currentUserNick ? message.nick + ' (You)' : message.nick }}
        </span>

        <p [class]="message.nick === currentUserNick ? 'text-white text-[11px] mt-0.5 font-medium' : 'text-slate-300 text-[11px] mt-0.5'">
          {{ message.text }}
        </p>
      </div>
    } @empty {
      <div class="text-slate-600 text-[11px] text-center py-12 flex-1 flex flex-col justify-center items-center">
       Don't have messages.
      </div>
    }
  </div>
  
  <div class="p-4 border-t border-blue-900/60 flex items-center gap-3 shrink-0">
    <input #msgInput 
           type="text" 
           placeholder="Type a message..." 
           (keyup.enter)="sendMessage(msgInput)"
           class="flex-1 w-full bg-[#06091f] text-white text-[11px] px-4 py-2 rounded-full border border-blue-900/60 focus:outline-none focus:border-cyan-400 transition-colors placeholder:text-slate-600">
    
    <button (click)="sendMessage(msgInput)" 
            class="bg-cyan-400 hover:bg-cyan-300 text-[#06091f] font-bold px-5 py-2 rounded-full text-[11px] shadow-[0_0_10px_rgba(34,211,238,0.4)] transition-all shrink-0">
      Send
    </button>
  </div>

</div>
