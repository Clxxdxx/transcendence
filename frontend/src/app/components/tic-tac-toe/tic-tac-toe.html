<div class="flex flex-col items-center py-8 gap-4">
  <div class="w-[320px] flex justify-between items-center">
    <button
      (click)="exit()"
      class="text-cyan-300 hover:text-white transition-colors text-sm cursor-pointer">
      ← Back
    </button>
    <span class="text-gray-400 text-sm">You are X — Best of 5</span>
  </div>

  <span class="text-cyan-200 text-lg font-semibold">You {{ playerWins }} - {{ aiWins }} AI</span>

  <div class="grid grid-cols-3 gap-2">
    @for (cell of board; track $index) {
      <button
        (click)="play($index)"
        [disabled]="!!cell"
        class="w-24 h-24 flex items-center justify-center text-4xl font-bold
               border border-gray-700 bg-black text-white
               hover:bg-gray-900 disabled:cursor-default transition-colors">
        {{ cell }}
      </button>
    }
  </div>
</div>
