<div class="flex flex-col items-center py-8 gap-4">
  <div class="w-[420px] flex justify-between items-center">
    <button
      (click)="exit()"
      class="text-cyan-300 hover:text-white transition-colors text-sm cursor-pointer">
      ← Back
    </button>
    <span class="text-gray-400 text-sm">You are red</span>
  </div>

  <div class="grid grid-cols-7 gap-2 bg-blue-900 p-3 rounded-xl border border-blue-700">
    @for (col of columns; track col) {
      <button
        (click)="play(col)"
        [disabled]="gameOver || !!board[0][col]"
        class="flex flex-col gap-2 cursor-pointer disabled:cursor-default group">
        @for (row of rows; track row) {
          <span
            class="w-12 h-12 rounded-full border border-blue-950 transition-colors"
            [ngClass]="{
              'bg-red-500': board[row][col] === 'R',
              'bg-yellow-400': board[row][col] === 'Y',
              'bg-black group-hover:bg-blue-800': !board[row][col]
            }">
          </span>
        }
      </button>
    }
  </div>
</div>
