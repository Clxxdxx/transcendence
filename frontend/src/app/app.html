<app-navbar></app-navbar>

<main>
  <div class="min-h-screen text-white p-[3vw]">
    
    <h2 class="text-2xl font-semibold mb-8 ml-[1vw] text-cyan-200 tracking-wide px-[4vw]">
      Featured Games
    </h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-[4vw] justify-items-center px-[4vw]">
      @for (game of games; track game.title) {
        <app-game-card 
          [title]="game.title" 
          [svgPath]="game.svg">
        </app-game-card>
      }
    </div>
  </div>
</main>
