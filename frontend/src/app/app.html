<app-navbar 
  [isLoggedIn]="isLoggedIn" 
  [userInitial]="userInitial"
  (loginClicked)="isLoginModalOpen = true"
  (signUpClicked)="isSignUpModalOpen = true"
  (logout)="onLogout()">
</app-navbar>

<main> 
    <div class="px-[8vw] py-10">
  
      <h2 class="text-2xl font-semibold mb-8 text-cyan-200 tracking-wide">
        Featured Games
      </h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-[2vw]">
        @for (game of games; track game.title) {
          <app-game-card 
            [title]="game.title" 
            [svgPath]="game.svg"
            (loginRequired)="isLoginModalOpen = true">
          </app-game-card>
        }
      </div>
    </div>
</main>

<app-footer></app-footer>

@if (isLoginModalOpen) {
  <app-auth-modal 
    (close)="isLoginModalOpen = false" 
    (loginSuccess)="onLoginSuccess($event)"
    (toSignUp)="toSignUp()"
    (forgotPassClicked)="toSendCodeModal()">
  </app-auth-modal>
}

@if (isSignUpModalOpen) {
  <app-sign-up-modal 
    (close)="isSignUpModalOpen = false" 
    (signUpSuccess)="onSignUpSuccess()"
    (toSignUp)="toSignUp()">
  </app-sign-up-modal>
}

@if (isSendCodeModalOpen) {
  <app-send-code-modal
    (close)="isSendCodeModalOpen = false"
    (toBack) = "onBack()"
    (toSendCode) = "toChangePass($event)">
  </app-send-code-modal> 
}

@if (isChangePassModalOpen) {
  <app-change-pass-modal
    [email]="emailParaCambiar"
    (close)="isChangePassModalOpen = false"
    (toBack)="onBackToCode()">
  </app-change-pass-modal>
}
