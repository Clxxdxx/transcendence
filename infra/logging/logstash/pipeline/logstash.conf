input {
  tcp {
    port => 5000
    codec => json
    type => "laravel"
  }
}

filter {
  if [type] == "laravel" {
    # normalize timestamp if exists
    if [datetime] {
      date {
        match => ["datetime", "ISO8601", "yyyy-MM-dd HH:mm:ss"]
        target => "@timestamp"
      }
    }

    # add service/app context
    mutate {
      add_field => { "service" => "backend" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # write to the rollover alias; ILM will manage concrete indices
    index => "laravel-logs-write"
  }
  stdout { codec => rubydebug }
}
